# Local-only JSON access-log gateway in front of VAmPI.
# Logs ONLY method, path (no query string), status and a has_auth boolean.
# The Authorization header value is never written anywhere.
worker_processes 1;
pid /tmp/sadm-nginx.pid;
events { worker_connections 64; }

http {
    map $http_authorization $has_auth {
        default "true";
        ""      "false";
    }
    log_format sadm escape=json
        '{"method":"$request_method","path":"$uri","status":$status,"has_auth":$has_auth}';
    access_log /var/log/nginx/sadm_access.jsonl sadm;
    error_log  /var/log/nginx/sadm_error.log warn;

    server {
        listen 80;                       # published on 127.0.0.1:8080 only (see docker-compose.yml)
        location / {
            proxy_pass http://vampi:5000;
            proxy_set_header Host $host;
        }
    }
}
