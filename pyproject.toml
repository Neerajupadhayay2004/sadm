[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sadm"
version = "1.0.0"
description = "Shadow API Discovery Module - passive OpenAPI vs. access-log comparison"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sadm = "sadm.cli:main"

[tool.setuptools]
packages = ["sadm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
